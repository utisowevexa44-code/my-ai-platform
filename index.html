<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز التدريب الإعلامي | Visual Caption Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #111, #000);
            background-color: #09090b;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white font-sans flex items-center justify-center p-6">

    <div class="glass max-w-2xl w-full p-8 md:p-12 rounded-[2.5rem] shadow-2xl">
        <div class="flex items-center gap-4 mb-10">
            <div class="bg-blue-600 p-3 rounded-2xl shadow-[0_0_20px_rgba(37,99,235,0.4)]">
                <i data-lucide="cpu" class="w-8 h-8 text-white"></i>
            </div>
            <div>
                <h1 class="text-xl md:text-2xl font-black tracking-tighter uppercase">مركز التدريب الإعلامي</h1>
                <p class="text-[10px] text-zinc-500 tracking-[0.3em] font-mono uppercase">Neural Content Engine v3.0</p>
            </div>
        </div>

        <div class="space-y-6">
            <div>
                <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-3 block">وصف الحدث أو الصورة</label>
                <textarea id="topic" rows="4" 
                    class="w-full bg-black/40 border border-zinc-800 p-4 rounded-2xl text-sm focus:border-blue-500 outline-none transition-all placeholder:text-zinc-700" 
                    placeholder="مثال: المتدربون يتدربون على مهارات الإلقاء أمام الكاميرا..."></textarea>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-3 block">مرحلة الفعالية</label>
                    <select id="phase" class="w-full bg-black/40 border border-zinc-800 p-4 rounded-2xl text-sm focus:border-blue-500 outline-none">
                        <option value="START">🚀 انطلاق: حماس وبداية</option>
                        <option value="MID">📸 كواليس: تدريب وتفاعل</option>
                        <option value="END">🎓 ختام: حصاد ونجاح</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-3 block">نمط المحتوى</label>
                    <select id="style" class="w-full bg-black/40 border border-zinc-800 p-4 rounded-2xl text-sm focus:border-blue-500 outline-none">
                        <option value="Professional">رسمي واحترافي</option>
                        <option value="Viral">تفاعلي وحماسي</option>
                        <option value="Creative">إبداعي وفني</option>
                    </select>
                </div>
            </div>

            <button onclick="generate()" id="genBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 py-5 rounded-2xl font-black text-xs uppercase tracking-[0.2em] flex items-center justify-center gap-3 transition-all active:scale-95 shadow-lg shadow-blue-900/20">
                <i data-lucide="zap" class="w-4 h-4 fill-current"></i>
                <span>بدء التصميم الذكي</span>
            </button>
        </div>

        <div id="resultBox" class="hidden mt-10 p-6 bg-black/60 border border-white/5 rounded-3xl animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="flex items-center justify-between mb-4">
                <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest">توصيف ذكي مقترح:</span>
                <button onclick="copyText()" class="text-zinc-500 hover:text-white transition-colors">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                </button>
            </div>
            <div id="resultText" class="text-zinc-300 leading-relaxed text-sm md:text-base text-right whitespace-pre-wrap"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function generate() {
            const btn = document.getElementById('genBtn');
            const topic = document.getElementById('topic').value;
            const phase = document.getElementById('phase').value;
            const style = document.getElementById('style').value;
            const resultBox = document.getElementById('resultBox');
            const resultText = document.getElementById('resultText');

            if(!topic) return alert("يرجى وصف الصورة أولاً");

            // تذكر: مفتاح الـ API يفضل وضعه هنا فقط إذا كان المستودع Private
            const KEY = "AIzaSyBpE1qLlq2lej5YMtDunOyQBKxiR-CInJM"; 

            btn.disabled = true;
            btn.innerHTML = "جاري المعالجة...";
            resultBox.classList.remove('hidden');
            resultText.innerHTML = "✨ جاري صياغة المحتوى الإعلامي...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `أنت خبير محتوى إعلامي. اكتب كابشن انستجرام تفاعلي لمركز تدريب إعلامي. الوصف: "${topic}"، المرحلة: "${phase}"، الأسلوب: "${style}". استخدم هاشتاقات وسؤال تفاعلي.` }]
                        }]
                    })
                });

                const data = await response.json();
                const aiResponse = data.candidates[0].content.parts[0].text;
                resultText.innerHTML = aiResponse;
            } catch (e) {
                resultText.innerHTML = "❌ حدث خطأ. تأكد من تفعيل مفتاح الـ API أو اتصالك بالإنترنت.";
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="zap" class="w-4 h-4 fill-current"></i><span>إعادة التصميم</span>';
                lucide.createIcons();
            }
        }

        function copyText() {
            const text = document.getElementById('resultText').innerText;
            navigator.clipboard.writeText(text);
            alert("تم نسخ النص!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Training Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-black text-white font-sans">

    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl shadow-2xl max-w-md w-full text-center">
            <h1 class="text-2xl font-black mb-6">مركز التدريب الإعلامي</h1>
            
            <div class="space-y-4">
                <textarea id="topic" class="w-full bg-black border border-zinc-700 p-4 rounded-xl text-sm" placeholder="أدخل موضوع المحتوى هنا..."></textarea>
                
                <select id="phase" class="w-full bg-black border border-zinc-700 p-3 rounded-xl text-sm">
                    <option value="start">مرحلة الانطلاق</option>
                    <option value="mid">مرحلة التغطية</option>
                    <option value="end">مرحلة الختام</option>
                </select>

                <button onclick="generate()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold transition-all">
                    توليد المحتوى الذكي
                </button>
            </div>

            <div id="result" class="mt-8 text-right text-zinc-400 text-sm leading-relaxed"></div>
        </div>
    </div>

    <script>
        // تفعيل الأيقونات
        lucide.createIcons();

        async function generate() {
            const resultDiv = document.getElementById('result');
            const topic = document.getElementById('topic').value;
            if(!topic) return alert("يرجى إدخال الموضوع");

            resultDiv.innerHTML = "جاري الاتصال بالنظام...";
            
            // هنا سيتم وضع كود الربط مع Gemini
            setTimeout(() => {
                resultDiv.innerHTML = "تم الاتصال بنجاح. النظام جاهز للعمل!";
            }, 1000);
        }
    </script>
</body>
</html>

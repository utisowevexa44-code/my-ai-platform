<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Training Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #09090b; color: white; min-height: 100vh; display: flex; items-center; justify-content: center; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 2rem; padding: 2rem; width: 100%; max-width: 500px; }
    </style>
</head>
<body class="p-4">
    <div class="glass shadow-2xl">
        <div class="flex items-center gap-3 mb-8">
            <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="cpu" class="text-white w-6 h-6"></i></div>
            <h1 class="text-xl font-bold">مركز التدريب الإعلامي</h1>
        </div>

        <div class="space-y-4">
            <textarea id="topic" class="w-full bg-black/40 border border-zinc-800 p-4 rounded-xl text-sm outline-none focus:border-blue-500 transition-all" placeholder="صف الصورة أو الفعالية هنا..." rows="3"></textarea>
            
            <select id="phase" class="w-full bg-black/40 border border-zinc-800 p-3 rounded-xl text-sm outline-none">
                <option value="انطلاق">🚀 مرحلة الانطلاق</option>
                <option value="تغطية">📸 مرحلة التغطية</option>
                <option value="ختام">🎓 مرحلة الختام</option>
            </select>

            <button onclick="generate()" id="btn" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all active:scale-95">
                <i data-lucide="zap" class="w-4 h-4"></i> توليد المحتوى الذكي
            </button>
        </div>

        <div id="output" class="hidden mt-6 p-4 bg-black/60 border border-white/5 rounded-xl text-sm text-zinc-300 leading-relaxed text-right"></div>
    </div>

    <script>
        lucide.createIcons();
        async function generate() {
            const topic = document.getElementById('topic').value;
            const phase = document.getElementById('phase').value;
            const output = document.getElementById('output');
            const btn = document.getElementById('btn');

            if(!topic) return alert("يرجى إدخال الوصف");

            btn.innerText = "جاري التوليد...";
            output.classList.remove('hidden');
            output.innerText = "✨ يتم الآن صياغة المحتوى...";

            try {
                const KEY = "AIzaSyBpE1qLlq2lej5YMtDunOyQBKxiR-CInJM";
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `اكتب كابشن انستجرام جذاب لمركز تدريب إعلامي عن موضوع: ${topic} في مرحلة: ${phase}. استخدم هاشتاقات مناسبة.` }] }] })
                });
                const data = await response.json();
                output.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                output.innerText = "خطأ في الاتصال، تأكد من مفتاح الـ API.";
            } finally {
                btn.innerHTML = '<i data-lucide="zap" class="w-4 h-4"></i> توليد مرة أخرى';
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
